name: thinkuplift
description: "ThinkUplift — Read. Reflect. Rebuild."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: 2.3.2
  google_fonts: ^6.2.1

# Pin the Android storage implementation to the stable pre-jni version.
# Newer shared_preferences_android (2.4+) pulls in package:jni, which
# currently breaks Gradle builds ("Could not find method kotlin()").
dependency_overrides:
  shared_preferences_android: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stories.json
